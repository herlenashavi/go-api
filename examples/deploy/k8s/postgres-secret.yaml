# Dev-only Postgres credentials — same spirit as secret.yaml's
# dev-jwt-secret: committed in plain (base64-encoded, not encrypted)
# stringData because this is a disposable local-dev value, never do this
# with a real credential. DATABASE_URL here is the in-cluster DSN
# heroes.yaml references directly; examples/Tiltfile's heroes-migrate
# local_resource uses the same user/password against the port-forwarded
# localhost:5432 to run migrations from the host. Those are the only two
# places this password appears — keeping them in sync by hand is a
# deliberate tradeoff for a two-file demo, not an oversight.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: go-api-demo
type: Opaque
stringData:
  POSTGRES_USER: heroes
  POSTGRES_PASSWORD: heroes-dev-password
  POSTGRES_DB: heroes
  DATABASE_URL: postgres://heroes:heroes-dev-password@postgres:5432/heroes?sslmode=disable
