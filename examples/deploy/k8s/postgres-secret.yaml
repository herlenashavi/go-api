# Dev-only Postgres credentials — same spirit as secret.yaml's
# dev-jwt-secret: committed in plain (base64-encoded, not encrypted)
# stringData because this is a disposable local-dev value, never do this
# with a real credential.
#
# One Postgres server, two databases, two unrelated credentials — heroes
# and villains share no database any more here than they share one at
# the application level (see examples/heroes/hero.go's
# Hero.NemesisVillainID doc comment). POSTGRES_USER/PASSWORD/DB bootstrap
# heroes' database (the one the postgres image creates on its own);
# villains' database and user are created separately by
# postgres-init-configmap.yaml, whose password this file's
# VILLAINS_DATABASE_URL must match by hand.
#
# DATABASE_URL / VILLAINS_DATABASE_URL are the in-cluster DSNs
# heroes.yaml / villains.yaml reference directly; examples/Tiltfile's
# heroes-migrate / villains-migrate local_resources use the same
# user/password against the port-forwarded localhost:5432 to run
# migrations from the host. Keeping those in sync by hand is a
# deliberate tradeoff for a demo this size, not an oversight.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: go-api-demo
type: Opaque
stringData:
  POSTGRES_USER: heroes
  POSTGRES_PASSWORD: heroes-dev-password
  POSTGRES_DB: heroes
  DATABASE_URL: postgres://heroes:heroes-dev-password@postgres:5432/heroes?sslmode=disable
  VILLAINS_DATABASE_URL: postgres://villains:villains-dev-password@postgres:5432/villains?sslmode=disable
