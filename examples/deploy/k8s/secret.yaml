# The same dev-only HMAC secret both services already fall back to when
# DEV_JWT_SECRET is unset (see authn.NewHMACVerifier's doc comment in
# either service's main.go) — wired here as a real Kubernetes Secret
# instead of relying on that default, because that's how you'd actually
# do it, not because the value itself is sensitive. Never do this with a
# real secret: this file is committed to source control in plain
# (base64-encoded, not encrypted) form, which is fine for a demo value
# and absolutely not fine for a production credential.
apiVersion: v1
kind: Secret
metadata:
  name: dev-jwt-secret
  namespace: go-api-demo
type: Opaque
stringData:
  DEV_JWT_SECRET: dev-secret-change-me
